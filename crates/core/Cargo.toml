[package]
name = "agent-pad-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Headless core of Agent Pad: skill discovery, the HTTP API, pasting and session status."

[dependencies]
arboard = "3.7.0"
cap-std = "4"
enigo = "0.6.1"
getrandom = "0.4"
percent-encoding = "2"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tempfile = "3"
tiny_http = "0.12"
toml_edit = "0.25"

[dev-dependencies]
ureq = { version = "2", features = ["json"] }
